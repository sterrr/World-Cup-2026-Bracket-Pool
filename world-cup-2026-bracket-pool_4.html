<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMD World Cup Bracket 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f7f5;--surface:#ffffff;--surface2:#eef2ee;--border:#c8d8c8;
  --accent:#1b7a2b;--accent2:#15611f;--gold:#d4a017;--silver:#7a8a7a;
  --text:#1a2e1a;--dim:#5a7a5a;--green:#1b7a2b;--green-bg:rgba(27,122,43,.08);
}
body{background:var(--bg);background-image:repeating-linear-gradient(0deg,transparent,transparent 60px,rgba(27,122,43,.03) 60px,rgba(27,122,43,.03) 120px);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
h1,h2,h3,.round-title,.group-hdr,.nav-btn,.submit-btn,.tab-btn{font-family:'Oswald',sans-serif}

/* ── HEADER ── */
.header{text-align:center;padding:30px 16px 0;position:relative}
.header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),var(--gold),var(--accent),transparent)}
.header h1{font-size:clamp(28px,5vw,48px);font-weight:700;letter-spacing:4px;text-transform:uppercase;background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .sub{font-size:13px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-top:2px}

/* ── NAV ── */
.nav{display:flex;justify-content:center;gap:4px;padding:16px 8px 14px;flex-wrap:wrap}
.nav-btn{padding:8px 18px;background:var(--surface);border:1px solid var(--border);color:var(--dim);cursor:pointer;font-size:14px;font-weight:600;letter-spacing:1.5px;border-radius:4px;transition:all .15s;text-transform:uppercase}
.nav-btn:hover{background:var(--surface2);color:var(--text)}
.nav-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── SECTIONS ── */
.view{display:none;max-width:1200px;margin:0 auto;padding:20px 16px}
.view.active{display:block}

/* ── WELCOME ── */
.welcome{max-width:460px;margin:0 auto;padding:60px 20px;text-align:center}
.welcome .trophy{font-size:64px;margin-bottom:12px}
.welcome h2{font-size:22px;color:var(--gold);letter-spacing:3px;text-transform:uppercase;margin-bottom:4px}
.welcome p{color:var(--dim);font-size:14px;line-height:1.6;margin-bottom:28px}
.welcome-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:24px}
.welcome-box input{width:100%;padding:12px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:15px;text-align:center;letter-spacing:1px;outline:none;margin-bottom:14px;font-family:'DM Sans',sans-serif}
.welcome-box input:focus{border-color:var(--gold)}
.btn-row{display:flex;gap:8px}
.btn-primary{flex:1;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:1px;text-transform:uppercase;font-family:'Oswald',sans-serif;transition:background .15s}
.btn-primary:hover{background:var(--accent2)}
.btn-secondary{flex:1;padding:12px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:1px;text-transform:uppercase;font-family:'Oswald',sans-serif}
.btn-secondary:hover{background:var(--border)}

/* ── ROUND TABS ── */
.round-tabs{display:flex;justify-content:center;gap:3px;padding:0 8px 12px;flex-wrap:wrap}
.tab-btn{padding:5px 14px;background:transparent;border:1px solid transparent;color:var(--dim);cursor:pointer;font-size:12px;font-weight:600;letter-spacing:1px;border-radius:4px;text-transform:uppercase;transition:all .12s}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{background:var(--surface2);border-color:var(--gold);color:var(--gold)}

/* ── GROUP CARDS ── */
.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
.group-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:transform .15s;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.group-card:hover{transform:translateY(-2px)}
.group-hdr{background:linear-gradient(135deg,#1b7a2b,#2e8b3e);padding:9px 14px;font-size:17px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#fff}
.team-row{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid rgba(27,122,43,.3);cursor:grab;font-size:14px;transition:background .1s}
.team-row:last-child{border-bottom:none}
.team-row.dragging{opacity:.4;background:var(--surface2)}
.team-row.drag-over{background:rgba(245,200,66,.06)}
.pos-badge{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.pos-1{background:var(--gold);color:#111}.pos-2{background:var(--silver);color:#111}
.pos-3{background:#b0c4b0;color:#3a5a3a}.pos-4{background:#d4e0d4;color:#6a8a6a}
.qualify-tag{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.5px}
.qualify-tag.adv{color:var(--gold)}.qualify-tag.third{color:var(--silver)}
.drag-hint{padding:5px 14px;font-size:11px;color:var(--dim);font-style:italic}

/* ── KNOCKOUT ── */
.round-title{text-align:center;font-size:22px;color:var(--gold);letter-spacing:3px;text-transform:uppercase;margin-bottom:16px}
.round-hint{text-align:center;font-size:11px;color:var(--dim);margin-top:-10px;margin-bottom:14px}
.ko-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;max-width:1000px;margin:0 auto}
.matchup{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;transition:border-color .15s}
.matchup:hover{border-color:rgba(245,200,66,.3)}
.matchup.final-match{border:2px solid var(--gold);box-shadow:0 0 20px rgba(245,200,66,.1)}
.match-label{font-size:10px;color:var(--dim);letter-spacing:1px;padding:4px 10px;background:rgba(22,32,53,.6);text-transform:uppercase;font-weight:600}
.pick-row{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;font-size:13px;cursor:pointer;border-bottom:1px solid rgba(27,122,43,.25);transition:all .12s}
.pick-row:last-child{border-bottom:none}
.pick-row:hover{background:rgba(27,122,43,.06)}
.pick-row.selected{background:var(--green-bg);color:var(--gold);font-weight:700}
.check{background:var(--green);color:#fff;border-radius:3px;padding:1px 7px;font-size:11px;font-weight:800}
.pick-row.tbd{cursor:default;color:var(--dim);font-style:italic}
.pick-row.tbd:hover{background:transparent}

/* ── CHAMPION ── */
.champion-box{text-align:center;margin-top:24px}
.champion-box .trophy{font-size:52px}
.champion-box .name{font-size:28px;font-weight:700;color:var(--gold);letter-spacing:3px;text-transform:uppercase;font-family:'Oswald',sans-serif}
.champion-box .label{font-size:12px;color:var(--dim);margin-top:4px}

/* ── SUBMIT ── */
.submit-bar{text-align:center;padding:16px}
.submit-btn{padding:12px 32px;background:var(--green);color:#fff;border:none;border-radius:6px;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:2px;text-transform:uppercase;transition:all .15s}
.submit-btn:hover{background:#17a34a;transform:translateY(-1px)}
.submit-btn:disabled{background:var(--surface2);color:var(--dim);cursor:default;transform:none}
.submit-count{font-size:12px;color:var(--dim);margin-top:6px}
.locked-badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700;background:rgba(29,185,84,.15);color:var(--green);margin-left:8px}

/* ── LEADERBOARD ── */
.lb-header{text-align:center;margin-bottom:20px}
.lb-header h2{font-size:22px;color:var(--gold);letter-spacing:3px;text-transform:uppercase}
.lb-header p{font-size:12px;color:var(--dim);margin-top:4px}
.lb-table{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;max-width:620px;margin:0 auto}
.lb-row{display:grid;grid-template-columns:44px 1fr 100px;align-items:center;padding:10px 16px;border-bottom:1px solid rgba(27,122,43,.3);transition:background .1s;cursor:pointer}
.lb-row:hover{background:var(--surface2)}
.lb-row:last-child{border-bottom:none}
.lb-row.me{background:rgba(245,200,66,.06);border-left:3px solid var(--gold)}
.lb-rank{font-weight:800}.lb-rank.r1{font-size:18px;color:var(--gold)}.lb-rank.r2{font-size:18px;color:var(--silver)}.lb-rank.r3{font-size:18px;color:#cd7f32}.lb-rank.rn{font-size:14px;color:var(--dim)}
.lb-name{font-weight:600;font-size:14px}
.you-tag{display:inline-block;padding:1px 7px;border-radius:8px;font-size:10px;font-weight:700;background:rgba(245,200,66,.15);color:var(--gold);margin-left:6px}
.lb-champ{text-align:right;font-size:13px;color:var(--dim)}
.lb-th{display:grid;grid-template-columns:44px 1fr 100px;padding:8px 16px;font-size:10px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;font-weight:700;border-bottom:1px solid var(--border)}
.refresh-btn{margin-top:10px;padding:6px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;cursor:pointer}
.empty-lb{text-align:center;color:var(--dim);padding:40px}

/* ── BRACKET VIEWER ── */
.viewer-card{margin-top:24px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;max-width:620px;margin-left:auto;margin-right:auto}
.viewer-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.viewer-hdr h3{font-size:16px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:1px}
.viewer-hdr .champ{font-size:12px;color:var(--dim)}
.close-btn{background:var(--surface2);border:1px solid var(--border);border-radius:4px;color:var(--text);padding:4px 12px;cursor:pointer;font-size:12px}
.viewer-round{margin-bottom:12px}
.viewer-round-title{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;font-family:'Oswald',sans-serif}
.picks-wrap{display:flex;flex-wrap:wrap;gap:6px}
.pick-chip{padding:3px 10px;background:var(--surface2);border-radius:4px;font-size:12px}

/* ── INFO ── */
.info-box{max-width:700px;margin:20px auto;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:24px;font-size:13px;color:var(--dim);line-height:1.8}
.info-box h3{font-family:'Oswald',sans-serif;color:var(--gold);font-size:18px;letter-spacing:2px;margin-bottom:8px}
.info-box strong{color:var(--text)}

@media(max-width:600px){
  .groups-grid{grid-template-columns:1fr}
  .ko-grid{grid-template-columns:1fr 1fr}
  .nav-btn{padding:6px 12px;font-size:12px}
}
</style>
</head>
<body>

<div id="app"></div>

<script>
// ══════════════════════════════════════════
// DATA
// ══════════════════════════════════════════
const GROUPS = {
  A:["Mexico","South Korea","South Africa","Czechia"],
  B:["Canada","Switzerland","Qatar","Bosnia-Herzegovina"],
  C:["Brazil","Morocco","Scotland","Haiti"],
  D:["USA","Paraguay","Australia","Turkiye"],
  E:["Germany","Ecuador","Ivory Coast","Curacao"],
  F:["Netherlands","Japan","Tunisia","Sweden"],
  G:["Belgium","Iran","Egypt","New Zealand"],
  H:["Spain","Uruguay","Saudi Arabia","Cape Verde"],
  I:["France","Senegal","Norway","Iraq"],
  J:["Argentina","Austria","Algeria","Jordan"],
  K:["Portugal","Colombia","Uzbekistan","DR Congo"],
  L:["England","Croatia","Panama","Ghana"],
};

const FLAGS = {
  "Mexico":"🇲🇽","South Korea":"🇰🇷","South Africa":"🇿🇦","Czechia":"🇨🇿",
  "Canada":"🇨🇦","Switzerland":"🇨🇭","Qatar":"🇶🇦","Bosnia-Herzegovina":"🇧🇦",
  "Brazil":"🇧🇷","Morocco":"🇲🇦","Scotland":"🇬🇧","Haiti":"🇭🇹",
  "USA":"🇺🇸","Paraguay":"🇵🇾","Australia":"🇦🇺","Turkiye":"🇹🇷",
  "Germany":"🇩🇪","Ecuador":"🇪🇨","Ivory Coast":"🇨🇮","Curacao":"🇨🇼",
  "Netherlands":"🇳🇱","Japan":"🇯🇵","Tunisia":"🇹🇳","Sweden":"🇸🇪",
  "Belgium":"🇧🇪","Iran":"🇮🇷","Egypt":"🇪🇬","New Zealand":"🇳🇿",
  "Spain":"🇪🇸","Uruguay":"🇺🇾","Saudi Arabia":"🇸🇦","Cape Verde":"🇨🇻",
  "France":"🇫🇷","Senegal":"🇸🇳","Norway":"🇳🇴","Iraq":"🇮🇶",
  "Argentina":"🇦🇷","Austria":"🇦🇹","Algeria":"🇩🇿","Jordan":"🇯🇴",
  "Portugal":"🇵🇹","Colombia":"🇨🇴","Uzbekistan":"🇺🇿","DR Congo":"🇨🇩",
  "England":"🇬🇧","Croatia":"🇭🇷","Panama":"🇵🇦","Ghana":"🇬🇭",
};

const R32 = [
  ["A1","C3"],["B1","A3"],["C1","B2"],["D1","E3"],
  ["E1","D2"],["F1","D3"],["A2","C2"],["B2","F3"],
  ["G1","I3"],["H1","G3"],["I1","H2"],["J1","K3"],
  ["K1","J2"],["L1","J3"],["G2","I2"],["H2","L3"],
];

const TOTAL_KO_PICKS = 31; // 16+8+4+2+1

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let state = {
  page: "welcome",      // welcome | bracket | leaderboard
  round: "groups",       // groups | r32 | r16 | qf | sf | final
  userName: "",
  nameInput: "",
  submitted: false,
  bracket: buildEmptyBracket(),
  leaderboard: [],
  viewingUser: null,
  loading: true,
  deadline: null,
  results: null,
};

function buildEmptyBracket() {
  const b = { groups:{}, r32:{}, r16:{}, qf:{}, sf:{}, final:null };
  Object.keys(GROUPS).forEach(g => b.groups[g] = [...GROUPS[g]]);
  return b;
}

function scoreBracket(bracket, results) {
  if (!results) return 0;
  let score = 0;
  Object.keys(results.groups||{}).forEach(g => {
    const actual = results.groups[g];
    const predicted = bracket.groups?.[g];
    if (!actual || !predicted) return;
    for (let i = 0; i < actual.length; i++) {
      if (predicted[i] === actual[i]) score++;
    }
  });
  ["r32","r16","qf","sf"].forEach(round => {
    const act = results[round]||{};
    const usr = bracket[round]||{};
    Object.keys(act).forEach(id => { if(usr[id]===act[id]) score++; });
  });
  if (results.final && bracket.final === results.final) score++;
  return score;
}

function isDeadlinePassed() {
  if (!state.deadline) return false;
  return new Date() > new Date(state.deadline);
}

// ══════════════════════════════════════════
// STORAGE HELPERS
// ══════════════════════════════════════════
async function storageGet(key, shared) {
  try { const r = await window.storage.get(key, shared); return r?.value || null; }
  catch(e) { return null; }
}
async function storageSet(key, val, shared) {
  try { await window.storage.set(key, val, shared); } catch(e) {}
}
async function storageList(prefix, shared) {
  try { const r = await window.storage.list(prefix, shared); return r?.keys || []; }
  catch(e) { return []; }
}

// ══════════════════════════════════════════
// BRACKET LOGIC
// ══════════════════════════════════════════
function deriveR32Teams(gp) {
  return R32.map(([c1,c2]) => {
    const t1 = gp[c1[0]]?.[parseInt(c1[1])-1] || "TBD";
    const t2 = gp[c2[0]]?.[parseInt(c2[1])-1] || "TBD";
    return [t1, t2];
  });
}

function getMatchups(round) {
  const b = state.bracket;
  if (round === "r32") return deriveR32Teams(b.groups);
  const prev = round === "r16" ? "r32" : round === "qf" ? "r16" : round === "sf" ? "qf" : null;
  if (!prev) return [];
  const prevPicks = b[prev] || {};
  const prevCount = round === "r16" ? 16 : round === "qf" ? 8 : round === "sf" ? 4 : 2;
  const matchups = [];
  for (let i = 0; i < prevCount; i += 2) {
    matchups.push([prevPicks[`${prev}_${i}`] || "TBD", prevPicks[`${prev}_${i+1}`] || "TBD"]);
  }
  return matchups;
}

function getFinalMatchup() {
  const s = state.bracket.sf || {};
  return [s["sf_0"] || "TBD", s["sf_1"] || "TBD"];
}

function countPicks() {
  const b = state.bracket;
  let c = 0;
  ["r32","r16","qf","sf"].forEach(r => c += Object.keys(b[r]||{}).length);
  if (b.final) c++;
  return c;
}

function clearDownstream(from) {
  const order = ["r32","r16","qf","sf","final"];
  const idx = order.indexOf(from);
  for (let i = idx + 1; i < order.length; i++) {
    if (order[i] === "final") state.bracket.final = null;
    else state.bracket[order[i]] = {};
  }
}

// ══════════════════════════════════════════
// DRAG & DROP FOR GROUPS
// ══════════════════════════════════════════
let dragGroup = null, dragIdx = null;

function onDragStart(group, idx, e) {
  if (state.submitted) return;
  dragGroup = group; dragIdx = idx;
  e.target.classList.add("dragging");
}
function onDragEnd(e) { e.target.classList.remove("dragging"); dragGroup = null; dragIdx = null; }
function onDragOver(e) { e.preventDefault(); e.currentTarget.classList.add("drag-over"); }
function onDragLeave(e) { e.currentTarget.classList.remove("drag-over"); }
function onDrop(group, idx, e) {
  e.currentTarget.classList.remove("drag-over");
  if (state.submitted || dragGroup !== group || dragIdx === null || dragIdx === idx) return;
  const arr = state.bracket.groups[group];
  const [moved] = arr.splice(dragIdx, 1);
  arr.splice(idx, 0, moved);
  clearDownstream("groups");
  state.bracket.r32 = {};
  render();
}

// ══════════════════════════════════════════
// KNOCKOUT PICK
// ══════════════════════════════════════════
function pickWinner(round, matchId, team) {
  if (state.submitted || team === "TBD") return;
  state.bracket[round][matchId] = team;
  clearDownstream(round);
  render();
}
function pickFinal(team) {
  if (state.submitted || team === "TBD") return;
  state.bracket.final = team;
  render();
}

// ══════════════════════════════════════════
// ACTIONS
// ══════════════════════════════════════════
async function handleJoin() {
  const name = state.nameInput.trim();
  if (!name) return;
  if (isDeadlinePassed()) { alert("The submission deadline has passed. You can no longer create new brackets."); return; }
  const existing = await storageGet(`wc26_bracket:${name}`, true);
  if (existing) { alert("That name is already taken! Try another."); return; }
  state.userName = name;
  await storageSet("wc26_my_name", name);
  state.page = "bracket"; state.round = "groups";
  render();
}

async function handleLogin() {
  const name = state.nameInput.trim();
  if (!name) return;
  const existing = await storageGet(`wc26_bracket:${name}`, true);
  if (existing) {
    state.userName = name;
    state.bracket = JSON.parse(existing);
    state.submitted = true;
    await storageSet("wc26_my_name", name);
    state.page = "bracket";
    render();
  } else {
    alert("No bracket found with that name. Try creating a new one.");
  }
}

async function handleSubmit() {
  if (isDeadlinePassed()) { alert("The submission deadline has passed!"); return; }
  const c = countPicks();
  if (c < TOTAL_KO_PICKS) { alert(`You still have ${TOTAL_KO_PICKS - c} picks to make!`); return; }
  if (!confirm("Once submitted, your bracket is LOCKED and cannot be changed. Are you sure?")) return;
  await storageSet(`wc26_bracket:${state.userName}`, JSON.stringify(state.bracket), true);
  state.submitted = true;
  await refreshLeaderboard();
  state.page = "leaderboard";
  render();
}

async function refreshLeaderboard() {
  const keys = await storageList("wc26_bracket:", true);
  const entries = [];
  for (const key of keys) {
    const val = await storageGet(key, true);
    if (val) {
      const b = JSON.parse(val);
      entries.push({ name: key.replace("wc26_bracket:",""), bracket: b, score: scoreBracket(b, state.results) });
    }
  }
  entries.sort((a,b) => b.score - a.score);
  state.leaderboard = entries;
}

// ══════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════
function render() {
  const app = document.getElementById("app");
  if (state.loading) {
    app.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column"><div style="font-size:48px">⚽</div><div style="color:var(--dim);letter-spacing:2px;text-transform:uppercase;font-size:13px;margin-top:12px">Loading bracket pool...</div></div>`;
    return;
  }

  if (state.page === "welcome" && !state.submitted) { renderWelcome(app); return; }
  let html = renderHeader();
  if (state.page === "bracket") html += renderBracket();
  else if (state.page === "leaderboard") html += renderLeaderboard();
  app.innerHTML = html;
  bindEvents();
}

function renderHeader() {
  const picks = countPicks();
  const isComplete = picks >= TOTAL_KO_PICKS;
  return `
  <div class="header">
    <h1>MMD World Cup Bracket</h1>
    <div class="sub">Playing as <strong style="color:var(--gold)">${esc(state.userName)}</strong>${state.submitted ? '<span class="locked-badge">LOCKED IN</span>' : ''}</div>
  </div>
  <div class="nav">
    <button class="nav-btn ${state.page==='bracket'?'active':''}" onclick="navTo('bracket')">My Bracket</button>
    <button class="nav-btn ${state.page==='leaderboard'?'active':''}" onclick="navTo('leaderboard')">Leaderboard</button>
    ${!state.submitted ? `<button class="nav-btn" style="background:${isComplete?'var(--green)':'var(--surface2)'};border-color:${isComplete?'var(--green)':'var(--border)'};color:${isComplete?'#fff':'var(--dim)'}" onclick="handleSubmit()">Submit (${picks}/${TOTAL_KO_PICKS})</button>` : ''}
  </div>`;
}

function renderBracket() {
  const rounds = [
    {id:"groups",label:"Groups"},{id:"r32",label:"R32"},{id:"r16",label:"R16"},
    {id:"qf",label:"QF"},{id:"sf",label:"Semi"},{id:"final",label:"Final"}
  ];
  let html = `<div class="round-tabs">${rounds.map(r =>
    `<button class="tab-btn ${state.round===r.id?'active':''}" onclick="setRound('${r.id}')">${r.label}</button>`
  ).join('')}</div><div class="view active">`;

  if (state.round === "groups") html += renderGroups();
  else if (state.round === "final") html += renderFinal();
  else html += renderKnockoutRound(state.round);

  html += '</div>';
  return html;
}

function renderGroups() {
  let html = `<div style="text-align:center;margin-bottom:14px"><div style="font-size:11px;color:var(--dim);letter-spacing:2px;text-transform:uppercase">${state.submitted ? 'Your group predictions (locked)' : 'Drag teams to predict group standings — top 2 + best 3rds advance'}</div></div><div class="groups-grid">`;
  Object.keys(GROUPS).forEach(g => {
    const teams = state.bracket.groups[g];
    html += `<div class="group-card"><div class="group-hdr">Group ${g}</div>`;
    teams.forEach((team, i) => {
      const posClass = `pos-${i+1}`;
      html += `<div class="team-row" draggable="${!state.submitted}" ondragstart="onDragStart('${g}',${i},event)" ondragend="onDragEnd(event)" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop('${g}',${i},event)"><div class="pos-badge ${posClass}">${i+1}</div><span>${FLAGS[team]||'🏳️'} ${esc(team)}</span>${i<2?'<span class="qualify-tag adv">QUALIFY</span>':i===2?'<span class="qualify-tag third">3RD</span>':''}</div>`;
    });
    if (!state.submitted) html += '<div class="drag-hint">Drag to reorder predictions</div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function renderKnockoutRound(round) {
  const titles = {r32:"Round of 32",r16:"Round of 16",qf:"Quarterfinals",sf:"Semifinals"};
  const matchups = getMatchups(round);
  const picks = state.bracket[round] || {};
  const labels = round === "r32" ? Array.from({length:16},(_,i)=>`Match ${49+i}`)
    : round === "r16" ? Array.from({length:8},(_,i)=>`Match ${65+i}`)
    : round === "qf" ? ["QF 1","QF 2","QF 3","QF 4"]
    : ["Semi-Final 1","Semi-Final 2"];

  let html = `<div class="round-title">${titles[round]}</div>`;
  if (!state.submitted) html += `<div class="round-hint">Click a team to pick the winner</div>`;
  html += '<div class="ko-grid">';
  matchups.forEach(([t1,t2], i) => {
    const id = `${round}_${i}`;
    const pick = picks[id];
    const tbd1 = t1==="TBD", tbd2 = t2==="TBD";
    html += `<div class="matchup"><div class="match-label">${labels[i]}</div>
      <div class="pick-row ${pick===t1?'selected':''} ${tbd1?'tbd':''}" onclick="${tbd1?'':`pickWinner('${round}','${id}','${escAttr(t1)}')`}""><span>${FLAGS[t1]||''} ${esc(t1)}</span>${pick===t1?'<span class="check">✓</span>':''}</div>
      <div class="pick-row ${pick===t2?'selected':''} ${tbd2?'tbd':''}" onclick="${tbd2?'':`pickWinner('${round}','${id}','${escAttr(t2)}')`}"><span>${FLAGS[t2]||''} ${esc(t2)}</span>${pick===t2?'<span class="check">✓</span>':''}</div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function renderFinal() {
  const [t1,t2] = getFinalMatchup();
  const pick = state.bracket.final;
  const tbd1 = t1==="TBD", tbd2 = t2==="TBD";
  let html = `<div style="text-align:center"><div class="round-title">The Final — MetLife Stadium</div>
    <div style="display:inline-block"><div class="matchup final-match"><div class="match-label">World Cup Final</div>
      <div class="pick-row ${pick===t1?'selected':''} ${tbd1?'tbd':''}" onclick="${tbd1?'':`pickFinal('${escAttr(t1)}')`}"><span>${FLAGS[t1]||''} ${esc(t1)}</span>${pick===t1?'<span class="check">✓</span>':''}</div>
      <div class="pick-row ${pick===t2?'selected':''} ${tbd2?'tbd':''}" onclick="${tbd2?'':`pickFinal('${escAttr(t2)}')`}"><span>${FLAGS[t2]||''} ${esc(t2)}</span>${pick===t2?'<span class="check">✓</span>':''}</div>
    </div></div>`;
  if (pick) {
    html += `<div class="champion-box"><div class="trophy">🏆</div><div class="name">${FLAGS[pick]||''} ${esc(pick)}</div><div class="label">Your predicted champion</div></div>`;
  }
  html += '</div>';
  return html;
}

function renderLeaderboard() {
  const lb = state.leaderboard;
  const deadlineStr = state.deadline ? `Deadline: ${new Date(state.deadline).toLocaleString()}` : '';
  let html = `<div class="view active"><div class="lb-header"><h2>Leaderboard</h2><p>${lb.length} participant${lb.length!==1?'s':''} — Click a player to see their picks</p>${deadlineStr?`<p style="color:var(--gold);font-size:12px;margin-top:4px">${deadlineStr}</p>`:''}<button class="refresh-btn" onclick="doRefresh()">↻ Refresh</button></div>`;
  if (lb.length === 0) {
    html += '<div class="empty-lb">No brackets submitted yet. Be the first!</div>';
  } else {
    html += '<div class="lb-table"><div class="lb-th" style="grid-template-columns:40px 1fr 60px 100px"><span>#</span><span>Player</span><span>Score</span><span style="text-align:right">Champion</span></div>';
    lb.forEach((entry, i) => {
      const isMe = entry.name === state.userName;
      const rank = i + 1;
      const rc = rank===1?'r1':rank===2?'r2':rank===3?'r3':'rn';
      const medal = rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':rank;
      html += `<div class="lb-row ${isMe?'me':''}" style="grid-template-columns:40px 1fr 60px 100px" onclick="viewUser(${i})"><span class="lb-rank ${rc}">${medal}</span><span class="lb-name">${esc(entry.name)}${isMe?'<span class="you-tag">YOU</span>':''}</span><span style="font-weight:700;color:var(--gold);font-family:'Oswald';font-size:16px">${entry.score||0}</span><span class="lb-champ">${FLAGS[entry.bracket?.final]||'—'} ${esc(entry.bracket?.final||'—')}</span></div>`;
    });
    html += '</div>';
  }

  if (state.viewingUser !== null) {
    const entry = lb[state.viewingUser];
    if (entry) {
      html += `<div class="viewer-card"><div class="viewer-hdr"><div><h3>${esc(entry.name)}'s Bracket</h3><div class="champ">Champion: ${FLAGS[entry.bracket?.final]||''} ${esc(entry.bracket?.final||'None')}</div></div><button class="close-btn" onclick="state.viewingUser=null;render()">Close</button></div>`;
      ["r32","r16","qf","sf"].forEach(round => {
        const picks = entry.bracket?.[round] || {};
        const entries = Object.values(picks);
        if (entries.length === 0) return;
        const label = round==="r32"?"Round of 32":round==="r16"?"Round of 16":round==="qf"?"Quarterfinals":"Semifinals";
        html += `<div class="viewer-round"><div class="viewer-round-title">${label}</div><div class="picks-wrap">${entries.map(t=>`<span class="pick-chip">${FLAGS[t]||''} ${esc(t)}</span>`).join('')}</div></div>`;
      });
      html += '</div>';
    }
  }

  html += '</div>';
  return html;
}

function renderWelcome(app) {
  const lb = state.leaderboard;
  const dlPassed = isDeadlinePassed();
  const dlStr = state.deadline ? new Date(state.deadline).toLocaleString() : null;
  app.innerHTML = `
  <div class="welcome">
    <div class="trophy">🏆</div>
    <h1 style="font-family:'Oswald';font-size:36px;font-weight:700;letter-spacing:4px;text-transform:uppercase;background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px">MMD World Cup Bracket</h1>
    <h2>2026 Bracket Pool</h2>
    <p>Pick your winners for every round. Lock in your bracket.</p>
    ${dlStr ? `<div style="margin-bottom:16px;padding:8px 16px;border-radius:6px;font-size:13px;background:${dlPassed?'rgba(239,68,68,.12)':'rgba(245,200,66,.1)'};color:${dlPassed?'#ef4444':'var(--gold)'};border:1px solid ${dlPassed?'rgba(239,68,68,.2)':'rgba(245,200,66,.2)'}">${dlPassed?'⏰ Deadline has passed — brackets are locked':'⏰ Submit by '+dlStr}</div>` : ''}
    <div class="welcome-box">
      <input id="nameInput" type="text" placeholder="Enter your display name" maxlength="24" onkeydown="if(event.key==='Enter')handleJoin()" />
      <div class="btn-row">
        ${dlPassed ? '<button class="btn-primary" disabled style="opacity:.4;cursor:default">Deadline Passed</button>' : '<button class="btn-primary" onclick="state.nameInput=document.getElementById(\'nameInput\').value;handleJoin()">New Bracket</button>'}
        <button class="btn-secondary" onclick="state.nameInput=document.getElementById('nameInput').value;handleLogin()">View My Picks</button>
      </div>
    </div>
    ${lb.length > 0 ? `<div style="margin-top:24px"><div style="font-size:12px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px">${lb.length} bracket${lb.length!==1?'s':''} submitted</div><button class="btn-secondary" style="display:inline-block;flex:none;padding:10px 24px;border-color:var(--gold);color:var(--gold)" onclick="state.page='leaderboard';render()">View Leaderboard</button></div>` : ''}
  </div>`;
}

// ══════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════
function esc(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return s.replace(/'/g,"\\'"); }
function navTo(p) { state.page = p; state.viewingUser = null; render(); }
function setRound(r) { state.round = r; render(); }
function viewUser(i) { state.viewingUser = i; render(); }
async function doRefresh() { await refreshLeaderboard(); render(); }

// ══════════════════════════════════════════
// BIND (for inline onclick that calls module fns)
// ══════════════════════════════════════════
function bindEvents() {}

// Make functions global
window.onDragStart = onDragStart;
window.onDragEnd = onDragEnd;
window.onDragOver = onDragOver;
window.onDragLeave = onDragLeave;
window.onDrop = onDrop;
window.pickWinner = pickWinner;
window.pickFinal = pickFinal;
window.handleJoin = handleJoin;
window.handleLogin = handleLogin;
window.handleSubmit = handleSubmit;
window.navTo = navTo;
window.setRound = setRound;
window.viewUser = viewUser;
window.doRefresh = doRefresh;
window.state = state;
window.render = render;

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
(async () => {
  try {
    const savedName = await storageGet("wc26_my_name");
    if (savedName) {
      state.userName = savedName;
      const myBracket = await storageGet(`wc26_bracket:${savedName}`, true);
      if (myBracket) {
        state.bracket = JSON.parse(myBracket);
        state.submitted = true;
      }
    }
  } catch(e) {}
  // Load admin results for scoring
  try {
    const res = await storageGet("wc26_results", true);
    if (res) state.results = JSON.parse(res);
  } catch(e) {}
  // Load deadline
  try {
    const dl = await storageGet("wc26_deadline", true);
    if (dl) state.deadline = dl;
  } catch(e) {}
  await refreshLeaderboard();
  state.loading = false;
  render();
})();
</script>
</body>
</html>
